<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>My Country</title>
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-6 py-12">
        <div class="absolute inset-0 bg-gradient-to-br from-orange-500/20 via-white/5 to-green-500/20"></div>
        <div class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-orange-500/20 blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 h-72 w-72 rounded-full bg-green-500/20 blur-3xl"></div>

        <section class="relative w-full max-w-3xl rounded-3xl border border-white/10 bg-white/10 p-8 text-center shadow-2xl backdrop-blur-md sm:p-12">
            <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-b from-orange-500 via-white to-green-500 text-3xl shadow-lg ring-4 ring-white/10">
                🇮🇳
            </div>
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.3em] text-orange-300">Proud and grateful</p>
            <h1 class="text-4xl font-extrabold tracking-tight sm:text-6xl">
                I love my <span class="bg-gradient-to-r from-orange-400 via-white to-green-400 bg-clip-text text-transparent">country.</span>
            </h1>
            <p class="mx-auto mt-6 max-w-xl text-base leading-7 text-slate-300 sm:text-lg">
                A beautiful place filled with rich culture, inspiring people, and endless possibilities.
            </p>
            <div class="mt-8 flex flex-wrap justify-center gap-3 text-sm font-medium">
                <span class="rounded-full border border-orange-400/30 bg-orange-400/10 px-4 py-2 text-orange-200">Unity</span>
                <span class="rounded-full border border-white/30 bg-white/10 px-4 py-2 text-white">Peace</span>
                <span class="rounded-full border border-green-400/30 bg-green-400/10 px-4 py-2 text-green-200">Progress</span>
            </div>
        </section>
    </main>
</body>
</html>
