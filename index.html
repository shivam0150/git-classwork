<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>My Country</title>
</head>
<body class="min-h-screen bg-[#0b0d12] text-white antialiased">
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-6 py-10">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(255,255,255,0.12),_transparent_35%),linear-gradient(135deg,_rgba(255,136,77,0.08),_rgba(255,255,255,0.02),_rgba(24,180,120,0.08))]"></div>
        <div class="absolute left-10 top-16 h-40 w-40 rounded-full border border-white/10 bg-white/5 blur-2xl"></div>
        <div class="absolute bottom-12 right-12 h-52 w-52 rounded-full border border-emerald-400/10 bg-emerald-400/5 blur-3xl"></div>

        <section class="relative w-full max-w-xl rounded-[30px] border border-white/10 bg-white/5 p-8 shadow-[0_0_60px_rgba(255,255,255,0.05)] backdrop-blur-xl sm:p-10">
            <div class="mb-6 flex items-center justify-between text-[10px] font-medium uppercase tracking-[0.35em] text-slate-400">
                <span>India</span>
                <span class="h-px w-16 bg-white/10"></span>
                <span>Love</span>
            </div>

            <div class="mb-7 flex items-center justify-center">
                <div class="flex h-16 w-16 items-center justify-center rounded-full border border-white/10 bg-[linear-gradient(135deg,_rgba(255,140,76,0.25),_rgba(255,255,255,0.04),_rgba(24,180,120,0.2))] text-3xl shadow-inner shadow-white/5">
                    🇮🇳
                </div>
            </div>

            <p class="mb-4 text-center text-xs font-medium uppercase tracking-[0.4em] text-slate-400">
                Proud and grateful
            </p>

            <h1 class="text-center text-4xl font-semibold tracking-[-0.06em] text-white sm:text-5xl">
                I love my<br />
                <span class="text-transparent bg-gradient-to-r from-orange-300 via-white to-emerald-300 bg-clip-text">country.</span>
            </h1>

            <p class="mx-auto mt-6 max-w-md text-center text-sm leading-7 text-slate-300 sm:text-base">
                A place of culture, resilience, and endless possibility.
            </p>

            <div class="mt-8 flex justify-center gap-2 text-[10px] font-medium uppercase tracking-[0.2em] text-slate-300">
                <span class="rounded-full border border-white/10 bg-white/5 px-3 py-2">Unity</span>
                <span class="rounded-full border border-white/10 bg-white/5 px-3 py-2">Peace</span>
                <span class="rounded-full border border-white/10 bg-white/5 px-3 py-2">Progress</span>
            </div>
        </section>
    </main>
</body>
</html>
